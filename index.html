<style>
/* Layout: one full-bleed WebGL stage; a quiet instrument HUD pinned to the four corners */
:root {
  --void: #020604;
  --forest: #06170d;
  --acid: #7cff4f;
  --lime: #d4ff5c;
  --lavender: #d8a0ff;
  --violet: #9a4dff;
  --ink: rgba(196, 255, 176, 0.72);
  --ink-dim: rgba(196, 255, 176, 0.38);
  --rule: rgba(124, 255, 79, 0.22);
  --mono: "Martian Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--void);
  color: var(--ink);
  overflow: hidden;
  font-family: var(--mono);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-font-smoothing: antialiased;
}
#stage {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
  cursor: crosshair;
  background: var(--void);
}
.hud {
  position: fixed;
  z-index: 2;
  pointer-events: none;
  font: 300 10px/1.7 var(--mono);
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--ink);
  display: grid;
  gap: 4px;
}
.tl, .tr { top: calc(env(safe-area-inset-top, 0px) + 20px); }
.bl, .br { bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); }
.tl, .bl { left: calc(max(16px, env(safe-area-inset-left, 0px)) + 6px); }
.tr, .br { right: calc(max(16px, env(safe-area-inset-right, 0px)) + 6px); text-align: right; }
.mark { font-weight: 500; font-size: 13px; letter-spacing: 0.22em; color: var(--acid); }
.dim { color: var(--ink-dim); }
.state { display: flex; align-items: center; gap: 8px; justify-content: flex-end; font-weight: 500; }
.dot { width: 6px; height: 6px; background: var(--acid); box-shadow: 0 0 10px var(--acid); }
.row { display: flex; justify-content: space-between; gap: 16px; font-variant-numeric: tabular-nums; }
.bl { width: min(176px, 42vw); }
.bar { height: 3px; background: var(--rule); position: relative; overflow: hidden; }
.bar i { position: absolute; inset: 0 auto 0 0; width: 100%; background: linear-gradient(90deg, var(--violet), var(--lavender) 40%, var(--acid)); transition: width 0.2s linear; }
/* sound and full screen sit together bottom right, where video players keep them */
.controls {
  position: fixed;
  z-index: 3;
  right: calc(max(16px, env(safe-area-inset-right, 0px)) + 4px);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
  display: flex;
  align-items: center;
  gap: 2px;
  color: var(--acid);
}
.ctl {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
  background: transparent;
  border: 0;
  color: inherit;
  font: 400 10px/1 var(--mono);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  opacity: 0.45;
  cursor: pointer;
  transition: opacity 0.2s;
}
.controls.left { right: auto; left: calc(max(16px, env(safe-area-inset-left, 0px)) + 4px); }
.ctl:hover, .ctl[aria-pressed="true"] { opacity: 0.85; }
.ctl:focus-visible { outline: 1px solid currentColor; outline-offset: 2px; opacity: 1; }
#snd .waves, #fs .exit { display: none; }
#snd[aria-pressed="true"] .waves, #fs[aria-pressed="true"] .exit { display: inline; }
#snd[aria-pressed="true"] .mute, #fs[aria-pressed="true"] .enter { display: none; }
/* other visitors' cursors */
#peers { position: fixed; inset: 0; z-index: 2; pointer-events: none; overflow: hidden; }
#peers i { position: absolute; left: 0; top: 0; width: 6px; height: 6px; margin: -3px 0 0 -3px; background: currentColor; box-shadow: 0 0 8px 2px currentColor, 0 0 22px 6px color-mix(in srgb, currentColor 35%, transparent); opacity: 0; will-change: transform, opacity; }
.fail { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding-inline: 24px; color: var(--lavender); font: 300 12px/1.8 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; }
@media (max-width: 480px) {
  .hud { font-size: 9px; }
  .tl .sub { max-width: 52vw; }
}

  const coarse = matchMedia("(pointer: coarse)").matches || Math.min(innerWidth, innerHeight) < 560;
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const MOTION = reduced ? 0.35 : 1.0;
  const SIM = coarse ? 224 : 320;
  const N = SIM * SIM;
  const PR = Math.min(window.devicePixelRatio || 1, coarse ? 1.75 : 2);

  renderer.setClearColor(0x000000, 1);

  // ---------- palette: a fresh hue pair on every load ----------
  // Keeps the relationships of the original acid green / lavender scheme, rotated round the wheel.

  const makePalette = (hue, off) => ({
    primary: hsl(hue, 1, 0.6),
    highlight: hsl(hue - 26, 1, 0.62),
    soft: hsl(hue + off, 1, 0.81),
    deep: hsl(hue + off - 13, 1, 0.61),
    bgNear: hsl(hue + 35, 0.54, 0.059),
    bgFar: hsl(hue + 45, 0.43, 0.014),
    bloom: hsl(hue + off - 4, 0.68, 0.048),
  });

  const PAL = makePalette(hue, 150 + Math.random() * 50);   // shader uniforms hold these exact objects
  let palTarget = null;
  function newPalette() {
    hue = (hue + 70 + Math.random() * 220) % 360;
    palTarget = makePalette(hue, 150 + Math.random() * 50);
  }
  function stepPalette(dt) {
    if (!palTarget) return;
    const k = Math.min(1, dt * 1.1);
    let done = true;
    for (const key in PAL) {
      PAL[key].lerpHSL(palTarget[key], k);
      if (Math.abs(PAL[key].r - palTarget[key].r) + Math.abs(PAL[key].g - palTarget[key].g) + Math.abs(PAL[key].b - palTarget[key].b) > 0.004) done = false;
    }
    if (done) { for (const key in PAL) PAL[key].copy(palTarget[key]); palTarget = null; }
    ctlBox.style.color = rstBox.style.color = "#" + PAL.primary.getHexString();
  }
  canvas.style.background = "#" + PAL.bgFar.getHexString();

  // ---------- wordmark target cloud ----------
  // AARON in bold geometric capitals, spaced wide; each letter is its own extruded slab.
  const T = 0.2;             // stroke weight, world units
  const HT = 0.5;            // half the cap height
  const S = 1024;            // raster resolution for sampling
  const SPAN = 6.4;          // world units across the raster

  const CLIP = 0.75;          // typed glyphs may poke above and below the cap band

    O: { w: 0.86, draw(g, x, w) {

    const FONT = '800 100px "Helvetica Neue", Helvetica, Arial, sans-serif';
    const m = document.createElement("canvas").getContext("2d");
    m.font = FONT;

      g.scale((k * em) / 100, (-k * em) / 100);

      if (hole > 0.64 && Math.random() < 0.88) continue;
      const row = Math.round(y / ROW);
      if (h2(row, 7) < 0.07 && Math.random() < 0.9) continue;
      if (Math.random() < 0.45) y = row * ROW + (Math.random() - 0.5) * 0.002; // LiDAR banding
      return [x, y, z, kind];
    }
    const [x, y] = pixel(parts[0].px.inner);
    return [x, y, parts[0].zc, 0];
  }

  const scanner = [2.8, 1.6, 5.0];
  const home = new Float32Array(N * 4);
  const aRef = new Float32Array(N * 2);
  const aRand = new Float32Array(N * 4);
  const aKind = new Float32Array(N);
  for (let i = 0; i < N; i++) {
    aRef[i * 2] = ((i % SIM) + 0.5) / SIM;
    aRef[i * 2 + 1] = (Math.floor(i / SIM) + 0.5) / SIM;
    aRand[i * 4] = Math.random();
    aRand[i * 4 + 2] = Math.random();
    aRand[i * 4 + 3] = Math.random();
  }
  function fillHome() {
    for (let i = 0; i < N; i++) {
      const r = Math.random();
      let x, y, z, kind;
      if (r < 0.035) {
        // multipath ghost returns smeared behind the surface, along the scanner's rays
        [x, y, z] = surfacePoint();
        let dx = x - scanner[0], dy = y - scanner[1], dz = z - scanner[2];
        const l = Math.hypot(dx, dy, dz), k = Math.pow(Math.random(), 2) * 0.9;
        x += dx / l * k; y += dy / l * k; z += dz / l * k;
        kind = 2;
      } else if (r < 0.05) {
        x = (Math.random() - 0.5) * 7.6; y = (Math.random() - 0.5) * 2.6; z = (Math.random() - 0.5) * 1.8;
        kind = 2;
      } else {
        [x, y, z, kind] = surfacePoint();
      }
      home[i * 4] = x; home[i * 4 + 1] = y; home[i * 4 + 2] = z; home[i * 4 + 3] = Math.random();
      let cp = Math.random();
      if (kind === 2) cp = 0.68 + Math.random() * 0.32;
      else if (kind === 1 && Math.random() < 0.35) cp = 0.6;
      aRand[i * 4 + 1] = cp;
      aKind[i] = kind;
    }
  }
  fillHome();
  const homeTex = new THREE.DataTexture(home, SIM, SIM, THREE.RGBAFormat, THREE.FloatType);
  homeTex.minFilter = homeTex.magFilter = THREE.NearestFilter;
  homeTex.needsUpdate = true;

  // ---------- shared GLSL ----------
  const HASH = `
    float hash11(float p){ p = fract(p * 0.1031); p *= p + 33.33; p *= p + p; return fract(p); }
    float hash21(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
  `;
  const NOISE = `
    vec3 mod289(vec3 x){ return x - floor(x * (1.0 / 289.0)) * 289.0; }
    vec4 mod289(vec4 x){ return x - floor(x * (1.0 / 289.0)) * 289.0; }
    vec4 permute(vec4 x){ return mod289(((x * 34.0) + 1.0) * x); }
    vec4 taylorInvSqrt(vec4 r){ return 1.79284291400159 - 0.85373472095314 * r; }
    float snoise(vec3 v){
      const vec2 C = vec2(1.0 / 6.0, 1.0 / 3.0);
      const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
      vec3 i = floor(v + dot(v, C.yyy));
      vec3 x0 = v - i + dot(i, C.xxx);
      vec3 g = step(x0.yzx, x0.xyz);
      vec3 l = 1.0 - g;
      vec3 i1 = min(g.xyz, l.zxy);
      vec3 i2 = max(g.xyz, l.zxy);
      vec3 x1 = x0 - i1 + C.xxx;
      vec3 x2 = x0 - i2 + C.yyy;
      vec3 x3 = x0 - D.yyy;
      i = mod289(i);
      vec4 p = permute(permute(permute(
                i.z + vec4(0.0, i1.z, i2.z, 1.0))
              + i.y + vec4(0.0, i1.y, i2.y, 1.0))
              + i.x + vec4(0.0, i1.x, i2.x, 1.0));
      float n_ = 0.142857142857;
      vec3 ns = n_ * D.wyz - D.xzx;
      vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
      vec4 x_ = floor(j * ns.z);
      vec4 y_ = floor(j - 7.0 * x_);
      vec4 x = x_ * ns.x + ns.yyyy;
      vec4 y = y_ * ns.x + ns.yyyy;
      vec4 h = 1.0 - abs(x) - abs(y);
      vec4 b0 = vec4(x.xy, y.xy);
      vec4 b1 = vec4(x.zw, y.zw);
      vec4 s0 = floor(b0) * 2.0 + 1.0;
      vec4 s1 = floor(b1) * 2.0 + 1.0;
      vec4 sh = -step(h, vec4(0.0));
      vec4 a0 = b0.xzyw + s0.xzyw * sh.xxyy;
      vec4 a1 = b1.xzyw + s1.xzyw * sh.zzww;
      vec3 p0 = vec3(a0.xy, h.x);
      vec3 p1 = vec3(a0.zw, h.y);
      vec3 p2 = vec3(a1.xy, h.z);
      vec3 p3 = vec3(a1.zw, h.w);
      vec4 norm = taylorInvSqrt(vec4(dot(p0, p0), dot(p1, p1), dot(p2, p2), dot(p3, p3)));
      p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
      vec4 m = max(0.6 - vec4(dot(x0, x0), dot(x1, x1), dot(x2, x2), dot(x3, x3)), 0.0);
      m = m * m;
      return 42.0 * dot(m * m, vec4(dot(p0, x0), dot(p1, x1), dot(p2, x2), dot(p3, x3)));
    }
  `;
  // digital rain letter distortion, shared by the rain (as a cut-out) and the outline (as particles).
  // Not a global wobble: a few patches tear on their own, and the cursor rips the letters near it.
  const WARP_GLSL = `
    uniform float uWarp, uWarpT, uWarpL;
    uniform vec3 uWarpC;
    float wHash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    float wNoise(vec2 p) {
      vec2 i = floor(p), f = fract(p);
      f = f * f * (3.0 - 2.0 * f);
      return mix(mix(wHash(i), wHash(i + vec2(1.0, 0.0)), f.x), mix(wHash(i + vec2(0.0, 1.0)), wHash(i + vec2(1.0, 1.0)), f.x), f.y);
    }
    vec2 warpOffset(vec2 q) {
      float patchy = smoothstep(0.62, 0.88, wNoise(q * 1.3 + vec2(uWarpT * 0.15, 3.1))) * uWarp;
      vec2 dc = q - uWarpC.xy;
      float local = exp(-dot(dc, dc) / 0.22) * uWarpL;
      float tick = floor(uWarpT * 7.0), slice = floor(q.y * 16.0);
      vec2 tear = vec2(wHash(vec2(slice, tick)) - 0.5, (wHash(vec2(slice + 7.0, tick)) - 0.5) * 0.3);
      vec2 shove = dc / (length(dc) + 0.15) * 0.35;
      vec2 ripple = vec2(sin(q.y * 9.0 + uWarpT * 4.0), cos(q.x * 8.0 + uWarpT * 3.5)) * 0.5;
      return (tear * 0.22 + ripple * 0.04) * (patchy + local) - shove * local * 0.16;
    }
    vec2 warp(vec2 q) { return q + warpOffset(q); }
  `;
  const FS_VERT = `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`;

  const MAXP = 6;   // how many other visitors' cursors can stir the letters at once

  // ---------- GPU simulation: velocity pass (w = accumulated damage) ----------
  const VEL_FRAG = `
    uniform sampler2D tPos; uniform sampler2D tVel; uniform sampler2D tHome;
    uniform float uTime, uDt, uEnergy, uCollapse, uGlitch, uInit, uHover, uSpeed, uRadius, uMotion;
    uniform float uGravity, uDampBoost, uStill, uKick, uFlowAmt;
    uniform sampler2D tFlow; uniform vec2 uFlowMin, uFlowSize;
    uniform vec3 uRayO, uRayD, uMouseVel;
    uniform vec4 uPeer[${MAXP}]; uniform vec3 uPeerVel[${MAXP}];   // other visitors: xy, presence, speed
    varying vec2 vUv;
    ${HASH}
    ${NOISE}
    void main(){
      if (uInit > 0.5) { gl_FragColor = vec4(0.0); return; }
      vec4 P = texture2D(tPos, vUv);
      vec4 V = texture2D(tVel, vUv);
      vec4 H = texture2D(tHome, vUv);
      vec3 p = P.xyz; vec3 v = V.xyz; vec3 h = H.xyz; float r = H.w; float dmg = P.w;
      float inst = clamp(uEnergy, 0.0, 1.5);

      // proximity: distance from the particle to the pointer ray, in object space
      vec3 op = p - uRayO;
      vec3 dv = op - uRayD * dot(op, uRayD);
      float d = length(dv);
      float R = uRadius * (1.0 + inst * 0.8 + min(uSpeed, 4.0) * 0.12);
      float f = smoothstep(R, 0.0, d) * uHover;

      vec3 n = vec3(
        snoise(p * 1.7 + vec3(0.0, 0.0, uTime * 0.3)),
        snoise(p * 1.7 + vec3(31.4, 0.0, uTime * 0.3)),
        snoise(p * 1.7 + vec3(0.0, 47.2, uTime * 0.3)));
      vec3 dir = d > 1e-4 ? dv / d : normalize(n + vec3(1e-3));

      // home spring, loosened by global instability and local damage
      float loosen = clamp(inst * 0.55 + dmg * 0.45, 0.0, 0.97);
      float k = mix(10.0, 0.5, loosen) * (0.55 + r * 0.9) * (1.0 - 0.985 * uCollapse) * (1.0 - 0.92 * uGravity);
      // digital rain: strong air currents tear fragments loose and sweep them off in long arcs
      vec2 flowV = texture2D(tFlow, (p.xy - uFlowMin) / uFlowSize).xy * uFlowAmt;
      float sweep = clamp(length(flowV) * 0.35, 0.0, 1.0) * (0.4 + r * 0.6);
      k *= 1.0 - 0.9 * sweep;
      vec3 acc = (h - p) * k;
      acc.xy += (flowV * 1.5 - v.xy) * sweep * 3.0;

      // turbulence: idle shimmer up to full abstraction
      acc += n * ((0.25 + inst * 2.4 + dmg * 1.4 + uGlitch * 1.5) * uMotion * (1.0 - uStill) + uCollapse * 10.0);

      // local field near the pointer: a noise partition decides repel, attract or swirl
      float mode = f > 0.0 ? snoise(h * 2.2 + vec3(uTime * 0.2)) : 0.0;
      float repel = smoothstep(-0.25, 0.35, mode);
      acc += dir * f * mix(-7.0, 16.0, repel);
      acc += cross(uRayD, dir) * f * 9.0 * (1.0 - abs(mode));

      // velocity: drag particles along with the pointer, tearing the surface
      acc += uMouseVel * f * (5.0 + min(uSpeed, 5.0) * 5.0);

      // fast strokes detonate the local cloud
      vec3 rnd = vec3(hash11(r * 917.3), hash11(r * 331.7 + 1.3), hash11(r * 613.1 + 7.1)) - 0.5;
      float blast = f * smoothstep(0.8, 3.5, uSpeed);
      acc += normalize(dir * 0.7 + rnd + vec3(1e-4)) * blast * 70.0 * (0.3 + r);

      // everyone else on the page stirs the letters with their cursors too
      float fPeers = 0.0;
      for (int i = 0; i < ${MAXP}; i++) {
        vec4 q = uPeer[i];
        if (q.z <= 0.0) continue;
        vec2 dq = p.xy - q.xy;
        float dl = length(dq);
        float fp = smoothstep(uRadius * (1.0 + min(q.w, 4.0) * 0.12), 0.0, dl) * q.z;
        if (fp <= 0.0) continue;
        vec3 pd = dl > 1e-4 ? vec3(dq / dl, 0.0) : dir;
        acc += pd * fp * mix(-7.0, 16.0, repel);
        acc += uPeerVel[i] * fp * (5.0 + min(q.w, 5.0) * 5.0);
        acc += normalize(pd * 0.7 + rnd + vec3(1e-4)) * fp * smoothstep(0.8, 3.5, q.w) * 70.0 * (0.3 + r);
        fPeers += fp * (0.3 + min(q.w, 5.0) * 1.2);
      }

      // collapse: radial dispersal into abstraction
      acc += normalize(p + rnd * 0.6 + vec3(1e-4)) * uCollapse * 2.5 * (0.2 + r);
      acc.x += sign(p.x + rnd.x) * uCollapse * 4.5 * (0.3 + r);   // fling wide, out to the sides

      // beat: an explosive outward burst of particles that the home spring snaps back; small beats twitch, big ones blow out
      vec3 outward = normalize(vec3(h.xy * vec2(0.6, 1.0), h.z + 0.4) + rnd * 0.9 + vec3(1e-4));
      v += (outward * 1.6 + vec3(0.0, 0.3, 0.0)) * uKick * uKick * (0.3 + r * 1.2);

      // digital rain transition: gravity drags the cloud down while it loses momentum
      acc.y -= uGravity * 5.0;

      v += acc * uDt;
      v *= exp(-(mix(5.0, 1.0, clamp(inst * 0.45 + uCollapse, 0.0, 1.0)) + uDampBoost * 4.0) * uDt);
      float sp = length(v);
      if (sp > 9.0) v *= 9.0 / sp;

      // damage accumulates where the pointer works the surface, heals slowly
      dmg += (f * (0.3 + min(uSpeed, 5.0) * 1.2) + fPeers) * uDt * 2.0;
      dmg += uCollapse * uDt * 0.6;
      dmg += uKick * uKick * 0.6 * r;   // beat-blown particles flare and swell
      dmg += sweep * uDt * 1.2;          // swept fragments stay lit while they fly
      dmg -= uDt * mix(0.9, 0.12, clamp(inst, 0.0, 1.0));
      gl_FragColor = vec4(v, clamp(dmg, 0.0, 1.5));
    }
  `;

  // ---------- GPU simulation: position pass ----------
  const POS_FRAG = `
    uniform sampler2D tPos; uniform sampler2D tVel; uniform sampler2D tHome;
    uniform float uDt, uInit, uTime, uGlitch, uEnergy;
    varying vec2 vUv;
    ${HASH}
    void main(){
      vec4 H = texture2D(tHome, vUv);
      if (uInit > 0.5) {
        float r = H.w;
        vec3 rnd = vec3(hash11(r * 917.3), hash11(r * 331.7 + 1.3), hash11(r * 613.1 + 7.1)) - 0.5;
        gl_FragColor = vec4(H.xyz + normalize(rnd + vec3(1e-4)) * (1.2 + 3.0 * hash11(r * 71.9)), 0.9);
        return;
      }
      vec4 P = texture2D(tPos, vUv);
      vec4 V = texture2D(tVel, vUv);
      vec3 p = P.xyz + V.xyz * uDt;
      // voxel corruption: during glitches whole slices snap toward a coarse grid
      float slice = floor(H.y * 22.0);
      float on = step(1.0 - (uGlitch * 0.5 + uEnergy * 0.04), hash21(vec2(slice, floor(uTime * 9.0))));
      float q = 0.05 + 0.1 * hash11(slice + 0.5);
      p = mix(p, floor(p / q + 0.5) * q, on * 0.5);
      float l = length(p);
      if (l > 10.0) p *= 10.0 / l;
      gl_FragColor = vec4(p, V.w);
    }
  `;

  // ---------- particle render ----------
  const PT_VERT = `
    attribute vec2 aRef; attribute vec4 aRand; attribute float aKind;
    uniform sampler2D tPos; uniform sampler2D tHome;
    uniform float uTime, uEnergy, uGlitch, uCollapse, uPR, uSize, uCamDist, uMotion;
    uniform float uRain, uPulse, uPulseAmp; uniform sampler2D tLight;
    ${WARP_GLSL}
    uniform vec3 uPrimary, uHighlight, uSoft, uDeep;
    varying vec3 vColor; varying float vAlpha; varying float vShape; varying float vSeed;
    ${HASH}
    void main(){
      vec4 P = texture2D(tPos, aRef);
      vec3 h = texture2D(tHome, aRef).xyz;
      vec3 p = P.xyz; float dmg = P.w;
      float tq = floor(uTime * 24.0);

      // unstable returns: a few points jump every frame
      float fl = step(0.992 - uEnergy * 0.03 - uGlitch * 0.05, hash21(vec2(aRand.x * 311.0, tq)));
      p += (vec3(hash21(vec2(aRand.x, tq)), hash21(vec2(aRand.y, tq)), hash21(vec2(aRand.z, tq))) - 0.5)
           * fl * (0.04 + uEnergy * 0.25) * uMotion * (1.0 - uRain);
      p.xy += (vec2(hash21(vec2(aRand.w, tq + 1.0)), hash21(vec2(aRand.x, tq + 2.0))) - 0.5) * 0.004 * uMotion * (1.0 - uRain);
      // digital rain: the outline tears with the same distortion the rain sees (inverse, so they line up)
      if (uRain > 0.0) p.xy -= warpOffset(h.xy) * uRain;

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      vec4 clip = projectionMatrix * mv;

      // screen-space tearing bands
      float row = floor((clip.y / clip.w * 0.5 + 0.5) * 64.0);
      float tq2 = floor(uTime * 16.0);
      float tearAmt = (uGlitch * 0.7 + uEnergy * 0.15 + uCollapse * 0.5) * uMotion;
      float tear = step(1.0 - tearAmt * 0.3, hash21(vec2(row, tq2)));
      clip.x += tear * (hash21(vec2(row * 1.7, tq2 + 3.0)) - 0.5) * 0.35 * tearAmt * clip.w;
      gl_Position = clip;

      float big = step(0.988, aRand.w);
      float sz = uSize * (0.55 + aRand.z * 1.1) * (1.0 + dmg * 0.7) * (1.0 + big * 2.2);
      sz *= 1.0 + uPulse * uPulse * uPulseAmp * step(0.55, aRand.w);   // beat: chunky pixels pop
      if (aKind > 1.5) sz *= 0.75;
      gl_PointSize = min(max(1.0, sz * uPR * uCamDist / -mv.z), 12.0 * uPR);

      vec3 acid = uPrimary;
      vec3 lime = uHighlight;
      vec3 lav  = uSoft;
      vec3 vio  = uDeep;
      float cp = aRand.y;
      vec3 c = acid;
      if (cp > 0.52) c = lime;
      if (cp > 0.62) c = lav;
      if (cp > 0.78) c = vio;
      if (cp > 0.965) c = vec3(1.0);

      // thin-film interference between the green and violet families
      float ph = dot(p, vec3(3.1, -2.3, 4.7)) + uTime * 0.7 + aRand.x * 2.0;
      c = mix(c, mix(acid, lav, 0.5 + 0.5 * sin(ph)), 0.12 + 0.3 * clamp(uEnergy, 0.0, 1.0));

      // the scanner's sweep travelling up the form
      float sweepY = mod(uTime * 0.45, 4.0) - 2.0;
      float swd = (h.y - sweepY) * 9.0;
      float sw = exp(-swd * swd);
      c = mix(c, mix(acid, vec3(1.0), 0.8), sw * 0.6);

      // damage burns toward violet and white
      c = mix(c, mix(vio, vec3(1.0), step(0.75, aRand.x)), clamp(dmg, 0.0, 1.0) * 0.75);
      if (aKind > 0.5 && aKind < 1.5) c *= 1.15;

      // digital rain: impact light pooled on the letter surfaces, strongest on the edges
      if (uRain > 0.0) {
        vec3 glint = texture2D(tLight, h.xy / ${SPAN.toFixed(4)} + 0.5).rgb;
        c += glint * (aKind > 0.5 && aKind < 1.5 ? 1.8 : 0.7) * uRain;
      }

      float depth = clamp(1.0 - (-mv.z - uCamDist) * 1.6, 0.25, 1.35);
      vColor = c * depth;
      vAlpha = (aKind > 1.5 ? 0.28 : 0.4) * (0.6 + 0.4 * aRand.z) * (1.0 + sw * 0.8);
      // digital rain: the fill dissolves and only a faint outline remains; the rain draws the letters
      // broken-off fragments light up while they fly, so the outline visibly shatters
      vAlpha *= mix(1.0, ((aKind > 0.5 && aKind < 1.5) ? 0.5 : 0.0) + clamp(dmg, 0.0, 1.0) * 0.8, uRain);
      if (vAlpha < 0.003) gl_Position = vec4(2.0, 2.0, 2.0, 1.0);   // invisible: clip it before it costs fill
      vShape = aRand.w;
      vSeed = aRand.x;
    }
  `;
  const PT_FRAG = `
    varying vec3 vColor; varying float vAlpha; varying float vShape; varying float vSeed;
    ${HASH}
    void main(){
      vec2 c = gl_PointCoord - 0.5;
      float a = 1.0;
      if (vShape > 0.985) a = step(0.45, hash21(floor(gl_PointCoord * 3.0) + vSeed * 97.0)); // broken pixel cluster
      else if (vShape > 0.4) a = smoothstep(0.5, 0.2, length(c));                           // dot
      if (a < 0.01) discard;
      gl_FragColor = vec4(vColor * vAlpha * a, 1.0);
    }
  `;

  // ---------- post: ghost trail ----------
  const TRAIL_FRAG = `
    uniform sampler2D tScene; uniform sampler2D tPrev;
    uniform float uDecay, uTime, uEnergy; uniform vec2 uDrift;
    varying vec2 vUv;
    ${HASH}
    void main(){
      vec3 cur = texture2D(tScene, vUv).rgb;
      float n = hash21(vec2(floor(vUv.y * 90.0), floor(uTime * 20.0)));
      vec2 off = uDrift + vec2((n - 0.5) * 0.004 * uEnergy, 0.0);
      vec3 prev = texture2D(tPrev, vUv - off).rgb * uDecay;
      gl_FragColor = vec4(max(cur, prev), 1.0);
    }
  `;

  // ---------- post: composite ----------
  const FINAL_FRAG = `
    uniform sampler2D tTrail;
    uniform float uTime, uEnergy, uGlitch, uSpeed, uCollapse, uHover, uAspect, uMotion;
    uniform vec2 uMouse, uSplitDir, uRes;
    uniform vec3 uBgNear, uBgFar, uBloom, uPulseCol;
    uniform float uPulse;
    varying vec2 vUv;
    ${HASH}
    void main(){
      vec2 uv = vUv;
      float prox = smoothstep(0.3, 0.0, length((uv - uMouse) * vec2(uAspect, 1.0))) * uHover;
      float sp = clamp(uSpeed / 3.0, 0.0, 1.5);
      float chaos = (uGlitch * 0.8 + uEnergy * 0.22 + uCollapse * 0.6) * uMotion;
      float local = prox * (0.2 + sp) * uMotion;

      // block displacement
      float bt = floor(uTime * (8.0 + 24.0 * chaos));
      vec2 grid = vec2(18.0, 32.0) * (0.6 + hash21(vec2(bt, 3.0)));
      vec2 blk = floor(uv * grid);
      float bh = hash21(blk + bt * 0.37);
      float amt = chaos * 0.2 + local * 0.55;
      vec2 duv = uv;
      if (bh < amt) duv += (vec2(hash21(blk + bt + 1.7), hash21(blk - bt + 9.1)) - 0.5) * vec2(0.18, 0.04) * (0.4 + chaos + local);

      // hairline tears
      float line = floor(uv.y * uRes.y / 3.0);
      float lt = step(1.0 - (chaos * 0.06 + local * 0.12), hash21(vec2(line, bt)));
      duv.x += lt * (hash21(vec2(line * 3.1, bt)) - 0.5) * 0.12;

      // chromatic separation along the direction of motion
      vec2 sd = uSplitDir * (0.0012 + uEnergy * 0.0035 + uGlitch * 0.012 + local * 0.02 + uCollapse * 0.01) * uMotion;
      vec3 col = vec3(texture2D(tTrail, duv + sd).r, texture2D(tTrail, duv).g, texture2D(tTrail, duv - sd).b);

      // fragmented duplicates

  // ---------- plumbing ----------
  const fsScene = new THREE.Scene();

    uTime: { value: 0 }, uDt: { value: 0.016 }, uEnergy: { value: 0 }, uCollapse: { value: 0 }, uGlitch: { value: 0 },
    uInit: { value: 1 }, uHover: { value: 0 }, uSpeed: { value: 0 }, uRadius: { value: 0.3 }, uMotion: { value: MOTION },
    uGravity: { value: 0 }, uDampBoost: { value: 0 }, uStill: { value: 0 }, uKick: { value: 0 },
    uFlowAmt: { value: 0 }, tFlow: { value: null }, uFlowMin: { value: new THREE.Vector2() }, uFlowSize: { value: new THREE.Vector2(1, 1) },

  const PIX_BUDGET = coarse ? 1.0e6 : 2.4e6;

  // ---------- digital rain: letter SDF, rain sim, air currents, impact light ----------
  // Signed distance to each letter part, built from the same rasters the cloud was sampled from.
  const SDF_RES = 512, SDF_RANGE = 0.5;
  function edt(grid, n) {
    const f = new Float64Array(n), v = new Int32Array(n), z = new Float64Array(n + 1);
    const line = (get, set) => {
      for (let q = 0; q < n; q++) f[q] = get(q);
      let k = 0;
      v[0] = 0; z[0] = -1e20; z[1] = 1e20;
      for (let q = 1; q < n; q++) {
        let s = ((f[q] + q * q) - (f[v[k]] + v[k] * v[k])) / (2 * q - 2 * v[k]);
        while (s <= z[k]) { k--; s = ((f[q] + q * q) - (f[v[k]] + v[k] * v[k])) / (2 * q - 2 * v[k]); }
        k++; v[k] = q; z[k] = s; z[k + 1] = 1e20;
      }
      k = 0;
      for (let q = 0; q < n; q++) { while (z[k + 1] < q) k++; set(q, (q - v[k]) * (q - v[k]) + f[v[k]]); }
    };
    for (let x = 0; x < n; x++) line((q) => grid[q * n + x], (q, val) => { grid[q * n + x] = val; });
    for (let y = 0; y < n; y++) line((q) => grid[y * n + q], (q, val) => { grid[y * n + q] = val; });

  function partSdf(data) {
    const n = SDF_RES, step = S / n, out = new Float64Array(n * n), inn = new Float64Array(n * n);

  const enc = (d) => Math.round((Math.max(-SDF_RANGE, Math.min(SDF_RANGE, d)) / (2 * SDF_RANGE) + 0.5) * 255);

    uniform sampler2D tSdf;

    vec3 letterNormal(vec3 p) {

  // rain velocity: gravity, air drag toward the current, cursor currents, bounces off the letters (w = impact glow)
  const RAIN_VEL_FRAG = `
    uniform sampler2D tRPos; uniform sampler2D tRVel; uniform sampler2D tFlow; uniform sampler2D tSeedVel;

      float sp = length(v);

  `;

  // rain position: integrate, stay outside the letters, wear out after bounces, respawn above (w = life)
  const RAIN_POS_FRAG = `
    uniform sampler2D tRPos; uniform sampler2D tRVel; uniform sampler2D tSeedPos;
    uniform float uTime, uDt, uSeed, uTop, uBottom, uHalfW, uDensity;
    varying vec2 vUv;

    attribute vec2 aRef; attribute vec4 aRand; attribute float aEnd;
    uniform sampler2D tRPos; uniform sampler2D tRVel;
    uniform float uPR, uCamDist, uAlpha, uSize, uGrain, uTear, uTearT, uHue;

    const ct = st.collapseHold > 0 ? 1 : 0;
    st.collapse += (ct - st.collapse) * Math.min(1, dt * (ct > st.collapse ? 3 : 2.2));

    // glitch pulses: rare at rest, frequent under pressure, lingering after
    const rate = (0.12 + st.energy * 1.2 + Math.min(st.speed, 4) * 0.4 * st.hover) * (reduced ? 0.4 : 1) * (st.mode === "rain" ? 0.6 + st.rainE * 1.5 : 1);
    if (Math.random() < rate * dt) {
      const g = 0.3 + Math.random() * 0.7;
      if (g > st.glitch) Sound.glitch(g);
      st.glitch = Math.max(st.glitch, g);
    }
    st.glitch *= Math.exp(-dt * 7);

    // digital rain unlock: sustained violent shaking fills a hidden reservoir; pauses drain it slowly
    st.rev *= Math.exp(-dt);
    if (st.mode === "af") {
      const shake = Math.max(0, Math.min(1.2, (st.speed - 1.2) / 2)) * (0.35 + 0.65 * Math.min(1, st.rev / 4)) * st.hover;
      if (shake > 0.02) st.unlock += shake * dt;
      else st.unlock = Math.max(0, st.unlock - dt * 1.5);
      if (st.unlock > UNLOCK * 0.6) st.energy = Math.min(1.4, st.energy + dt * 0.5);
      if (!rainWarm && st.unlock > UNLOCK * 0.25) warmRain();
      if (st.unlock >= UNLOCK) { st.mode = "transition"; st.modeT = 0; }
    } else {
      // chaos peaks, momentum drains, gravity pulls the fragments down, the letters rebuild, rain takes over
      st.modeT += dt;
      const T = st.modeT, tr = st.mode === "transition";
      const chaos = tr ? 1 - smooth(1.1, 2.6, T) : 0;
      st.energy = 1.4 * chaos;
      st.collapse = chaos;
      st.collapseHold = 0;
      if (tr) st.glitch *= chaos;
      st.gravity = tr ? smooth(1.0, 1.9, T) * (1 - smooth(3.0, 4.3, T)) : 0;
      st.damp = tr ? smooth(1.4, 2.6, T) * (1 - smooth(4.6, 6.2, T)) : 0;
      st.rainMix = tr ? smooth(3.0, 6.8, T) : 1;
      st.rainAlpha = tr ? smooth(1.5, 3.4, T) : 1;
      if (tr && !rainSeeded && T > 1.5) seedRain();
      if (tr && T > 7.2) st.mode = "rain";
    }
    st.press += ((pointer.down ? 1 : 0) - st.press) * Math.min(1, dt * 6);
    const rm = st.rainMix;

    // slow sway plus pointer parallax; in digital rain the AF settles into a fixed, still pose
    const tx = pointer.inside ? pointer.ndc.x : 0, ty = pointer.inside ? pointer.ndc.y : 0;
    st.parX += (tx - st.parX) * Math.min(1, dt * 1.5);
    st.parY += (ty - st.parY) * Math.min(1, dt * 1.5);
    const sway = reduced ? 0.4 : 1;
    // in digital rain the camera drifts on its own, swinging the angle the rain falls at
    const ry = REST.y + (Math.sin(t * 0.13) * 0.16 + Math.sin(t * 0.051 + 1.7) * 0.08) * sway;
    const rx = REST.x + Math.sin(t * 0.09 + 0.6) * 0.12 * sway;
    const rz = (Math.sin(t * 0.07) * 0.22 + Math.sin(t * 0.031 + 2.3) * 0.1) * sway;
    sculpture.rotation.y = (Math.sin(t * 0.21) * 0.06 * sway + st.parX * 0.28) * (1 - rm) + ry * rm;
    sculpture.rotation.x = (Math.sin(t * 0.13) * 0.04 * sway - st.parY * 0.25) * (1 - rm) + rx * rm;
    sculpture.rotation.z = Math.sin(t * 0.09) * 0.012 * sway * (1 - rm) + rz * rm;
    sculpture.updateMatrixWorld();

    // pointer ray into object space
    raycaster.setFromCamera(pointer.ndc, camera);
    inv.copy(sculpture.matrixWorld).invert();
    rayO.copy(raycaster.ray.origin).applyMatrix4(inv);
    rayD.copy(raycaster.ray.direction).transformDirection(inv);
    if (pointer.inside && Math.abs(rayD.z) > 1e-4) {
      hit.copy(rayD).multiplyScalar(-rayO.z / rayD.z).add(rayO);
      if (st.lastHit) {
        tmpV.copy(hit).sub(st.lastHit).divideScalar(Math.max(dt, 1 / 240));
        if (tmpV.length() > 14) tmpV.setLength(14);
        st.velWorld.lerp(tmpV, Math.min(1, dt * 12));
      } else st.lastHit = new THREE.Vector3();
      st.lastHit.copy(hit);
    }
    st.velWorld.multiplyScalar(Math.exp(-dt * 4));
    stepPeers(dt, now);

    const vu = velMat.uniforms;
    vu.uTime.value = t; vu.uDt.value = dt; vu.uEnergy.value = st.energy; vu.uCollapse.value = st.collapse;
    // in digital rain the cursor only nudges the outline gently
    // in digital rain the word still shatters under the cursor; clicks blow a hole in it
    st.clickBoom *= Math.exp(-dt * 6);
    vu.uGlitch.value = st.glitch; vu.uHover.value = st.hover; vu.uSpeed.value = Math.max(st.speed * (1 - 0.3 * rm), st.clickBoom * 4);
    if (rm > 0) vu.uEnergy.value = Math.max(st.energy, st.rainE * 0.7 * rm);
    vu.uMouseVel.value.copy(st.velWorld);
    vu.uGravity.value = st.gravity; vu.uDampBoost.value = st.damp; vu.uStill.value = rm * (1 - Math.min(1, st.rainE));
    const pu = posMat.uniforms;
    pu.uTime.value = t; pu.uDt.value = dt; pu.uGlitch.value = st.glitch; pu.uEnergy.value = st.energy;
    const pt = ptMat.uniforms;
    pt.uTime.value = t; pt.uEnergy.value = st.energy; pt.uGlitch.value = st.glitch; pt.uCollapse.value = st.collapse;
    pt.uRain.value = rm;
    pt.uPulse.value = st.pulse;
    const tu = trailMat.uniforms;
    tu.uTime.value = t % 600; tu.uEnergy.value = st.energy;
    tu.uDecay.value = Math.max(0.3 * rm, Math.min(0.95, 0.35 + Math.min(st.energy, 1) * 0.5 + st.glitch * 0.1 + st.collapse * 0.1));
    tu.uDrift.value.set(st.velScreen.x * dt * 0.25 * st.hover * (1 - rm), st.velScreen.y * dt * 0.25 * st.hover * (1 - rm) + 0.0008 * st.energy);
    const fu = finalMat.uniforms;
    fu.uTime.value = t % 600; fu.uEnergy.value = st.energy; fu.uGlitch.value = st.glitch; fu.uSpeed.value = st.speed;
    fu.uCollapse.value = st.collapse; fu.uHover.value = st.hover * (1 - 0.35 * rm);
    // digital rain glitches too: block tears, colour split and pixel shifts grow with rain energy
    if (rm > 0) fu.uEnergy.value = Math.max(st.energy, (0.25 + st.rainE * 0.7) * rm);
    fu.uMouse.value.set(pointer.ndc.x * 0.5 + 0.5, pointer.ndc.y * 0.5 + 0.5);
    fu.uSplitDir.value.copy(st.splitDir);

    // big-beat pulse from behind, every couple of bars, locked to the music when it plays
    const pk = Sound.pulse();
    if (pk > 0) {
      st.pulse = Math.max(st.pulse, pk);
      fu.uPulseCol.value.copy(pk >= 1 ? PAL.soft : PAL.primary);
    }
    vu.uKick.value = pk * (1 - 0.6 * Math.min(1, st.energy));   // particles bounce on the big beats
    if (pk >= 0.75) st.glitch = Math.max(st.glitch, pk * 0.7);   // the biggest beats hit the image too
    rainVelMat.uniforms.uKick.value = pk;

    // after a big chaotic episode calms down, the whole palette turns to a new colour
    if (st.mode === "af") {
      st.peak = Math.max(st.peak, st.energy + st.collapse);
      if (st.peak > 1.1 && st.energy < 0.08 && st.collapse < 0.05) { newPalette(); st.peak = 0; }
    } else st.peak = 0;
    if (st.mode === "rain" && !st.rainRecoloured) { st.rainRecoloured = true; newPalette(); }
    stepPalette(dt);

    // letter warp in digital rain: a faint ripple at rest, stronger as you stir and on the beat
    // rain energy: messing with the rain builds it up, and it drains slowly when left alone
    st.rainE = Math.max(0, Math.min(1.5, st.rainE + dt * rm * (Math.min(st.speed, 4) * 0.18 * st.hover + st.press * 0.6) - dt * 0.25));
    const warpTarget = rm * (0.5 + st.pulse * 0.8 + st.rainE * 1.6);
    warpU.value += (warpTarget - warpU.value) * Math.min(1, dt * 3);
    const localTarget = rm * (Math.min(st.speed, 3) * 1.0 * st.hover + st.press * 1.8 + st.clickBoom * 1.5);
    warpL.value += (localTarget - warpL.value) * Math.min(1, dt * 5);
    warpC.value.set(hit.x, hit.y, 0);
    warpT.value = t % 600;
    st.pulse *= Math.exp(-dt * 3.2);
    fu.uPulse.value = st.pulse;

    if (rainSeeded) {
      // rain field sized to what the camera sees; the cursor stirs the air only in digital rain
      const halfH = camera.position.z * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)), halfW = halfH * camera.aspect;
      flowMin.set(-halfW * 1.3, -halfH * 1.4);
      flowSize.set(halfW * 2.6, halfH * 2.8);
      const ru = rainVelMat.uniforms, rp = rainPosMat.uniforms, fl = flowMat.uniforms;
      ru.uTime.value = rp.uTime.value = t;
      ru.uHover.value = st.hover * rm;
      ru.uPress.value = st.press * rm;
      ru.uSpeed.value = st.speed;
      // extra margin so the tilted rain field still covers the corners
      rp.uTop.value = halfH * 1.4 + 0.4;
      rp.uBottom.value = halfH * 1.6;
      rp.uHalfW.value = halfW * 1.5;
      // weather drifts: wind, turbulence, density and drop size all wander independently
      const wc = weather;
      const wx = (k, rate) => vnoise(t * rate * wc.pace, k * 17.3 + wc.seed);
      ru.uWind.value = wc.wind + (wx(1, 0.05) - 0.5) * wc.gust * (1 + st.rainE * 1.5);
      ru.uChaos.value = wc.chaos + Math.pow(wx(2, 0.04), 2) * wc.storm + st.pulse * 0.8 + st.rainE * 2.5;
      ru.uBurst.value = st.burst;
      st.burst = 0;
      rp.uDensity.value = wc.dens + (1 - wc.dens) * wx(3, 0.035);
      // clicks restyle the rain: shape switches instantly, size and colour glide to the new look
      st.shapeSize += ([1, 1.1, 2.2, 1.9, 2.8][st.rainShape] - st.shapeSize) * Math.min(1, dt * 8);
      rainUniforms.uShape.value = st.rainShape;
      rainUniforms.uHue.value += (st.rainHue - rainUniforms.uHue.value) * Math.min(1, dt * 4);
      rainUniforms.uGrain.value = (wc.grain + wc.grainAmp * wx(4, 0.03)) * st.shapeSize;
      fl.uCursor.value.set(hit.x, hit.y);
      fl.uCursorVel.value.set(st.velWorld.x, st.velWorld.y).multiplyScalar(pointer.inside ? 1 : 0);
      fl.uSplat.value = rm * (1.6 + st.press * 1.2) * (1 + st.rainE * 0.8);
      // the letters feel the same currents as the rain, and the cursor reaches further
      vu.tFlow.value = flowRT[fCur].texture;
      vu.uFlowAmt.value = rm;
      vu.uRadius.value = 0.3 * (1 + rm * 1.2);
      rainUniforms.uAlpha.value = st.rainAlpha;
      rainUniforms.uCamDist.value = ptMat.uniforms.uCamDist.value;
      rainUniforms.uCamLocal.value.copy(camera.position).applyMatrix4(inv);
      rainUniforms.uTear.value = (st.glitch * 0.9 + st.rainE * 0.25) * MOTION;
      rainUniforms.uTearT.value = t % 600;
      rainUniforms.uPR.value = pointPR;
      rainGeo.setDrawRange(0, Math.floor(RN / Math.max(1, st.shapeSize * st.shapeSize * 0.5)));
    }
    Sound.frame(st);
  }

  // ---------- loop ----------
  let cur = 0, tCur = 0, first = true, last = performance.now() / 1000, t0 = last;
  let perfAcc = 0, perfN = 0, perfT = last, lastRaf = last, rafEma = 1 / 60, skipOdd = false;
  canvas.addEventListener("webglcontextrestored", () => { first = true; resize(); });
  function frame() {
    const nowS = performance.now() / 1000;
    // on 90 Hz+ screens draw every other refresh (about 60 fps); wait out a lost GPU context
    const iv = nowS - lastRaf;
    lastRaf = nowS;
    if (iv > 0 && iv < 0.1) rafEma += (iv - rafEma) * 0.05;
    if (rafEma < 1 / 90) skipOdd = !skipOdd;
    else skipOdd = false;
    if (skipOdd || glc.isContextLost()) { requestAnimationFrame(frame); return; }
    const raw = nowS - last;
    const dt = Math.min(1 / 30, Math.max(1 / 240, raw));
    last = nowS;

    // adaptive quality: if frames run slow for a couple of seconds, shrink the offscreen buffers
    if (nowS - t0 > 4 && raw < 0.25) {
      perfAcc += raw;
      perfN++;
      if (nowS - perfT > 2) {
        if (perfAcc / perfN > 0.024 && qScale > 0.5) { qScale = Math.max(0.5, qScale * 0.8); resize(); }
        perfAcc = perfN = 0;
        perfT = nowS;
      }
    }
    const t = nowS - t0;
    update(dt, t);

    const nxt = 1 - cur;
    velMat.uniforms.uInit.value = posMat.uniforms.uInit.value = first ? 1 : 0;
    velMat.uniforms.tPos.value = posRT[cur].texture;
    velMat.uniforms.tVel.value = velRT[cur].texture;
    pass(velMat, velRT[nxt]);
    posMat.uniforms.tPos.value = posRT[cur].texture;
    posMat.uniforms.tVel.value = velRT[nxt].texture;
    pass(posMat, posRT[nxt]);
    cur = nxt;
    first = false;
    if (rainSeeded) stepRain(dt);

    ptMat.uniforms.tPos.value = posRT[cur].texture;
    renderer.setRenderTarget(sceneRT);
    renderer.render(scene, camera);

    const tn = 1 - tCur;
    trailMat.uniforms.tScene.value = sceneRT.texture;
    trailMat.uniforms.tPrev.value = trailRT[tCur].texture;
    pass(trailMat, trailRT[tn]);
    tCur = tn;

    finalMat.uniforms.tTrail.value = trailRT[tCur].texture;
    pass(finalMat, null);

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>

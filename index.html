<title>AF Point Cloud</title>

<style>
/* Layout: one full-bleed WebGL stage; a quiet instrument HUD pinned to the four corners */
:root {
  --void: #020604;
  --forest: #06170d;
  --acid: #7cff4f;
  --lime: #d4ff5c;
  --lavender: #d8a0ff;
  --violet: #9a4dff;
  --ink: rgba(196, 255, 176, 0.72);
  --ink-dim: rgba(196, 255, 176, 0.38);
  --rule: rgba(124, 255, 79, 0.22);
  --mono: "Martian Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--void);
  color: var(--ink);
  overflow: hidden;
  font-family: var(--mono);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-font-smoothing: antialiased;
}
#stage {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
  cursor: crosshair;
  background: var(--void);
}
.hud {
  position: fixed;
  z-index: 2;
  pointer-events: none;
  font: 300 10px/1.7 var(--mono);
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--ink);
  display: grid;
  gap: 4px;
}
.tl, .tr { top: calc(env(safe-area-inset-top, 0px) + 20px); }
.bl, .br { bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); }
.tl, .bl { left: calc(max(16px, env(safe-area-inset-left, 0px)) + 6px); }
.tr, .br { right: calc(max(16px, env(safe-area-inset-right, 0px)) + 6px); text-align: right; }
.mark { font-weight: 500; font-size: 13px; letter-spacing: 0.22em; color: var(--acid); }
.dim { color: var(--ink-dim); }
.state { display: flex; align-items: center; gap: 8px; justify-content: flex-end; font-weight: 500; }
.dot { width: 6px; height: 6px; background: var(--acid); box-shadow: 0 0 10px var(--acid); }
.row { display: flex; justify-content: space-between; gap: 16px; font-variant-numeric: tabular-nums; }
.bl { width: min(176px, 42vw); }
.bar { height: 3px; background: var(--rule); position: relative; overflow: hidden; }
.bar i { position: absolute; inset: 0 auto 0 0; width: 100%; background: linear-gradient(90deg, var(--violet), var(--lavender) 40%, var(--acid)); transition: width 0.2s linear; }
#snd {
  position: fixed;
  z-index: 3;
  right: calc(max(16px, env(safe-area-inset-right, 0px)) + 4px);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
  background: transparent;
  border: 0;
  color: var(--acid);
  font: 400 10px/1 var(--mono);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  opacity: 0.45;
  cursor: pointer;
  transition: opacity 0.2s;
}
#snd:hover, #snd[aria-pressed="true"] { opacity: 0.85; }
#snd:focus-visible { outline: 1px solid currentColor; outline-offset: 2px; opacity: 1; }
#snd .waves { display: none; }
#snd[aria-pressed="true"] .waves { display: inline; }
#snd[aria-pressed="true"] .mute { display: none; }
.fail { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding-inline: 24px; color: var(--lavender); font: 300 12px/1.8 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; }
@media (max-width: 480px) {
  .hud { font-size: 9px; }
  .tl .sub { max-width: 52vw; }
}
</style>

<canvas id="stage" aria-label="An AF monogram built from a glitching cloud of green and violet particles. Move the pointer through it to disturb it."></canvas>

<button id="snd" type="button" aria-pressed="false" aria-label="Turn sound on">
  <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
    <path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/>
    <path class="waves" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    <path class="mute" d="M16.5 9.5l5 5m0-5l-5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
  </svg>
  <span>Sound</span>
</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  "use strict";

  const $ = (id) => document.getElementById(id);
  function fail(msg) {
    const d = document.createElement("div");
    d.className = "fail";
    d.textContent = msg;
    document.body.appendChild(d);
  }
  if (!window.THREE) { fail("Three.js did not load. Check your connection and reload."); return; }

  const canvas = $("stage");
  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: false, powerPreference: "high-performance" });
  } catch (e) {
    fail("This piece needs WebGL, and your browser has it switched off.");
    return;
  }

  // ---------- capability checks ----------
  const isGL2 = renderer.capabilities.isWebGL2;
  const ext = (n) => !!renderer.extensions.get(n);
  let simType, fxType;
  if (isGL2) {
    const f = ext("EXT_color_buffer_float");
    const h = f || ext("EXT_color_buffer_half_float");
    simType = f ? THREE.FloatType : THREE.HalfFloatType;
    fxType = h ? THREE.HalfFloatType : THREE.UnsignedByteType;
  } else {
    simType = ext("OES_texture_float") ? THREE.FloatType : THREE.HalfFloatType;
    fxType = THREE.UnsignedByteType;
  }

  const coarse = matchMedia("(pointer: coarse)").matches || Math.min(innerWidth, innerHeight) < 560;
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const MOTION = reduced ? 0.35 : 1.0;
  const SIM = coarse ? 224 : 320;
  const N = SIM * SIM;
  const PR = Math.min(window.devicePixelRatio || 1, 2);
  renderer.setPixelRatio(PR);
  renderer.setClearColor(0x000000, 1);

  // ---------- palette: a fresh hue pair on every load ----------
  // Keeps the relationships of the original acid green / lavender scheme, rotated round the wheel.
  const hue = Math.random() * 360;
  const off = 150 + Math.random() * 50;
  const hsl = (h, s, l) => new THREE.Color().setHSL((((h % 360) + 360) % 360) / 360, s, l);
  const PAL = {
    primary: hsl(hue, 1, 0.6),
    highlight: hsl(hue - 26, 1, 0.62),
    soft: hsl(hue + off, 1, 0.81),
    deep: hsl(hue + off - 13, 1, 0.61),
    bgNear: hsl(hue + 35, 0.54, 0.059),
    bgFar: hsl(hue + 45, 0.43, 0.014),
    bloom: hsl(hue + off - 4, 0.68, 0.048),
  };
  canvas.style.background = "#" + PAL.bgFar.getHexString();

  // ---------- monogram target cloud ----------
  // A and F share a foot and one bar: the A's crossbar runs on to become the F's middle arm.
  const T = 0.36;            // stroke weight, world units
  const S = 512;             // raster resolution for sampling
  const SPAN = 2.7;          // world units across the raster
  const toPx = (x, y) => [(x / SPAN + 0.5) * S, (0.5 - y / SPAN) * S];

  function raster(draw) {
    const c = document.createElement("canvas");
    c.width = c.height = S;
    const g = c.getContext("2d");
    g.fillStyle = g.strokeStyle = "#fff";
    g.lineWidth = (T / SPAN) * S;
    g.lineCap = "butt";
    g.lineJoin = "miter";
    g.miterLimit = 20;
    const [cx0, cy0] = toPx(-2, 1);
    const [cx1, cy1] = toPx(2, -1);
    g.beginPath();
    g.rect(cx0, cy0, cx1 - cx0, cy1 - cy0);
    g.clip();
    draw(g);
    return g.getImageData(0, 0, S, S).data;
  }
  const rect = (g, x0, y0, x1, y1) => {
    const [a, b] = toPx(x0, y1), [c, d] = toPx(x1, y0);
    g.fillRect(a, b, c - a, d - b);
  };
  const ext3 = (p, q, k) => { const dx = q[0] - p[0], dy = q[1] - p[1], l = Math.hypot(dx, dy); return [q[0] + dx / l * k, q[1] + dy / l * k]; };

  const apex = [-0.32, 1.0], footL = [-1.14, -1.0], footR = [0.4, -1.0];
  const aData = raster((g) => {
    const l = ext3(apex, footL, 0.4), r = ext3(apex, footR, 0.4);
    g.beginPath();
    g.moveTo(...toPx(l[0], l[1]));
    g.lineTo(...toPx(apex[0], apex[1]));
    g.lineTo(...toPx(r[0], r[1]));
    g.stroke();
  });
  const fData = raster((g) => {
    rect(g, 0.42 - T / 2, -1.2, 0.42 + T / 2, 1.0);
    rect(g, 0.42 - T / 2, 1.0 - T, 1.24, 1.0);
  });
  const barData = raster((g) => rect(g, -0.84, -0.3 - T / 2, 1.04, -0.3 + T / 2));

  function collect(data) {
    const inner = [], edge = [];
    const a = (x, y) => (x < 0 || y < 0 || x >= S || y >= S) ? 0 : data[(y * S + x) * 4 + 3];
    for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
      if (a(x, y) < 128) continue;
      const isEdge = a(x - 2, y) < 128 || a(x + 2, y) < 128 || a(x, y - 2) < 128 || a(x, y + 2) < 128;
      (isEdge ? edge : inner).push(x, y);
    }
    return { inner: Int32Array.from(inner), edge: Int32Array.from(edge) };
  }
  const parts = [
    { px: collect(aData), zc: -0.14, d: 0.12 },
    { px: collect(fData), zc: 0.14, d: 0.12 },
    { px: collect(barData), zc: 0.0, d: 0.25 },
  ];
  parts.forEach((p) => (p.area = (p.px.inner.length + p.px.edge.length) / 2));
  const totalArea = parts.reduce((s, p) => s + p.area, 0);

  // cheap value noise for scan dropouts
  function h2(a, b) {
    let n = Math.imul(a, 374761393) + Math.imul(b, 668265263);
    n = Math.imul(n ^ (n >>> 13), 1274126177);
    return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
  }
  function vnoise(x, y) {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    const a = h2(xi, yi), b = h2(xi + 1, yi), c = h2(xi, yi + 1), d = h2(xi + 1, yi + 1);
    return (a + (b - a) * u) * (1 - v) + (c + (d - c) * u) * v;
  }
  const gauss = () => (Math.random() + Math.random() + Math.random() - 1.5) * 0.8;
  const ROW = 0.022;

  function pickPart() {
    let r = Math.random() * totalArea;
    for (const p of parts) { if ((r -= p.area) <= 0) return p; }
    return parts[0];
  }
  function pixel(list) {
    const i = (Math.random() * (list.length / 2)) | 0;
    const x = list[i * 2] + Math.random(), y = list[i * 2 + 1] + Math.random();
    return [(x / S - 0.5) * SPAN, (0.5 - y / S) * SPAN];
  }
  function surfacePoint() {
    for (let tries = 0; tries < 10; tries++) {
      const part = pickPart();
      const u = Math.random();
      let x, y, z, kind = 0;
      if (u < 0.3 && part.px.edge.length) {
        [x, y] = pixel(part.px.edge);
        z = part.zc + (Math.random() * 2 - 1) * part.d;           // side walls
        kind = 1;
      } else {
        const list = part.px.inner.length ? part.px.inner : part.px.edge;
        [x, y] = pixel(list);
        if (u < 0.86) z = part.zc + (Math.random() < 0.62 ? part.d : -part.d) + gauss() * 0.01; // faces
        else z = part.zc + (Math.random() * 2 - 1) * part.d;        // volumetric noise
      }
      // corrupted scan: blotchy holes and missing scan lines
      const hole = vnoise(x * 2.4 + 11.3, y * 2.4 - 4.1) * 0.62 + vnoise(x * 8.0, y * 8.0 + 3.0) * 0.38;
      if (hole > 0.64 && Math.random() < 0.88) continue;
      const row = Math.round(y / ROW);
      if (h2(row, 7) < 0.07 && Math.random() < 0.9) continue;
      if (Math.random() < 0.45) y = row * ROW + (Math.random() - 0.5) * 0.002; // LiDAR banding
      return [x, y, z, kind];
    }
    const [x, y] = pixel(parts[0].px.inner);
    return [x, y, parts[0].zc, 0];
  }

  const scanner = [2.8, 1.6, 5.0];
  const home = new Float32Array(N * 4);
  const aRef = new Float32Array(N * 2);
  const aRand = new Float32Array(N * 4);
  const aKind = new Float32Array(N);
  for (let i = 0; i < N; i++) {
    const r = Math.random();
    let x, y, z, kind;
    if (r < 0.035) {
      // multipath ghost returns smeared behind the surface, along the scanner's rays
      [x, y, z] = surfacePoint();
      let dx = x - scanner[0], dy = y - scanner[1], dz = z - scanner[2];
      const l = Math.hypot(dx, dy, dz), k = Math.pow(Math.random(), 2) * 0.9;
      x += dx / l * k; y += dy / l * k; z += dz / l * k;
      kind = 2;
    } else if (r < 0.05) {
      x = (Math.random() - 0.5) * 4.6; y = (Math.random() - 0.5) * 3.2; z = (Math.random() - 0.5) * 1.8;
      kind = 2;
    } else {
      [x, y, z, kind] = surfacePoint();
    }
    home[i * 4] = x; home[i * 4 + 1] = y; home[i * 4 + 2] = z; home[i * 4 + 3] = Math.random();
    aRef[i * 2] = ((i % SIM) + 0.5) / SIM;
    aRef[i * 2 + 1] = (Math.floor(i / SIM) + 0.5) / SIM;
    let cp = Math.random();
    if (kind === 2) cp = 0.68 + Math.random() * 0.32;
    else if (kind === 1 && Math.random() < 0.35) cp = 0.6;
    aRand[i * 4] = Math.random();
    aRand[i * 4 + 1] = cp;
    aRand[i * 4 + 2] = Math.random();
    aRand[i * 4 + 3] = Math.random();
    aKind[i] = kind;
  }
  const homeTex = new THREE.DataTexture(home, SIM, SIM, THREE.RGBAFormat, THREE.FloatType);
  homeTex.minFilter = homeTex.magFilter = THREE.NearestFilter;
  homeTex.needsUpdate = true;

  // ---------- shared GLSL ----------
  const HASH = `
    float hash11(float p){ p = fract(p * 0.1031); p *= p + 33.33; p *= p + p; return fract(p); }
    float hash21(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
  `;
  const NOISE = `
    vec3 mod289(vec3 x){ return x - floor(x * (1.0 / 289.0)) * 289.0; }
    vec4 mod289(vec4 x){ return x - floor(x * (1.0 / 289.0)) * 289.0; }
    vec4 permute(vec4 x){ return mod289(((x * 34.0) + 1.0) * x); }
    vec4 taylorInvSqrt(vec4 r){ return 1.79284291400159 - 0.85373472095314 * r; }
    float snoise(vec3 v){
      const vec2 C = vec2(1.0 / 6.0, 1.0 / 3.0);
      const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
      vec3 i = floor(v + dot(v, C.yyy));
      vec3 x0 = v - i + dot(i, C.xxx);
      vec3 g = step(x0.yzx, x0.xyz);
      vec3 l = 1.0 - g;
      vec3 i1 = min(g.xyz, l.zxy);
      vec3 i2 = max(g.xyz, l.zxy);
      vec3 x1 = x0 - i1 + C.xxx;
      vec3 x2 = x0 - i2 + C.yyy;
      vec3 x3 = x0 - D.yyy;
      i = mod289(i);
      vec4 p = permute(permute(permute(
                i.z + vec4(0.0, i1.z, i2.z, 1.0))
              + i.y + vec4(0.0, i1.y, i2.y, 1.0))
              + i.x + vec4(0.0, i1.x, i2.x, 1.0));
      float n_ = 0.142857142857;
      vec3 ns = n_ * D.wyz - D.xzx;
      vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
      vec4 x_ = floor(j * ns.z);
      vec4 y_ = floor(j - 7.0 * x_);
      vec4 x = x_ * ns.x + ns.yyyy;
      vec4 y = y_ * ns.x + ns.yyyy;
      vec4 h = 1.0 - abs(x) - abs(y);
      vec4 b0 = vec4(x.xy, y.xy);
      vec4 b1 = vec4(x.zw, y.zw);
      vec4 s0 = floor(b0) * 2.0 + 1.0;
      vec4 s1 = floor(b1) * 2.0 + 1.0;
      vec4 sh = -step(h, vec4(0.0));
      vec4 a0 = b0.xzyw + s0.xzyw * sh.xxyy;
      vec4 a1 = b1.xzyw + s1.xzyw * sh.zzww;
      vec3 p0 = vec3(a0.xy, h.x);
      vec3 p1 = vec3(a0.zw, h.y);
      vec3 p2 = vec3(a1.xy, h.z);
      vec3 p3 = vec3(a1.zw, h.w);
      vec4 norm = taylorInvSqrt(vec4(dot(p0, p0), dot(p1, p1), dot(p2, p2), dot(p3, p3)));
      p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
      vec4 m = max(0.6 - vec4(dot(x0, x0), dot(x1, x1), dot(x2, x2), dot(x3, x3)), 0.0);
      m = m * m;
      return 42.0 * dot(m * m, vec4(dot(p0, x0), dot(p1, x1), dot(p2, x2), dot(p3, x3)));
    }
  `;
  const FS_VERT = `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`;

  // ---------- GPU simulation: velocity pass (w = accumulated damage) ----------
  const VEL_FRAG = `
    uniform sampler2D tPos; uniform sampler2D tVel; uniform sampler2D tHome;
    uniform float uTime, uDt, uEnergy, uCollapse, uGlitch, uInit, uHover, uSpeed, uRadius, uMotion;
    uniform vec3 uRayO, uRayD, uMouseVel;
    varying vec2 vUv;
    ${HASH}
    ${NOISE}
    void main(){
      if (uInit > 0.5) { gl_FragColor = vec4(0.0); return; }
      vec4 P = texture2D(tPos, vUv);
      vec4 V = texture2D(tVel, vUv);
      vec4 H = texture2D(tHome, vUv);
      vec3 p = P.xyz; vec3 v = V.xyz; vec3 h = H.xyz; float r = H.w; float dmg = P.w;
      float inst = clamp(uEnergy, 0.0, 1.5);

      // proximity: distance from the particle to the pointer ray, in object space
      vec3 op = p - uRayO;
      vec3 dv = op - uRayD * dot(op, uRayD);
      float d = length(dv);
      float R = uRadius * (1.0 + inst * 0.8 + min(uSpeed, 4.0) * 0.12);
      float f = smoothstep(R, 0.0, d) * uHover;

      vec3 n = vec3(
        snoise(p * 1.7 + vec3(0.0, 0.0, uTime * 0.3)),
        snoise(p * 1.7 + vec3(31.4, 0.0, uTime * 0.3)),
        snoise(p * 1.7 + vec3(0.0, 47.2, uTime * 0.3)));
      vec3 dir = d > 1e-4 ? dv / d : normalize(n + vec3(1e-3));

      // home spring, loosened by global instability and local damage
      float loosen = clamp(inst * 0.55 + dmg * 0.45, 0.0, 0.97);
      float k = mix(10.0, 0.5, loosen) * (0.55 + r * 0.9) * (1.0 - 0.985 * uCollapse);
      vec3 acc = (h - p) * k;

      // turbulence: idle shimmer up to full abstraction
      acc += n * ((0.25 + inst * 2.4 + dmg * 1.4 + uGlitch * 1.5) * uMotion + uCollapse * 10.0);

      // local field near the pointer: a noise partition decides repel, attract or swirl
      float mode = snoise(h * 2.2 + vec3(uTime * 0.2));
      float repel = smoothstep(-0.25, 0.35, mode);
      acc += dir * f * mix(-7.0, 16.0, repel);
      acc += cross(uRayD, dir) * f * 9.0 * (1.0 - abs(mode));

      // velocity: drag particles along with the pointer, tearing the surface
      acc += uMouseVel * f * (5.0 + min(uSpeed, 5.0) * 5.0);

      // fast strokes detonate the local cloud
      vec3 rnd = vec3(hash11(r * 917.3), hash11(r * 331.7 + 1.3), hash11(r * 613.1 + 7.1)) - 0.5;
      float blast = f * smoothstep(0.8, 3.5, uSpeed);
      acc += normalize(dir * 0.7 + rnd + vec3(1e-4)) * blast * 70.0 * (0.3 + r);

      // collapse: radial dispersal into abstraction
      acc += normalize(p + rnd * 0.6 + vec3(1e-4)) * uCollapse * 2.5 * (0.2 + r);

      v += acc * uDt;
      v *= exp(-mix(5.0, 1.0, clamp(inst * 0.45 + uCollapse, 0.0, 1.0)) * uDt);
      float sp = length(v);
      if (sp > 9.0) v *= 9.0 / sp;

      // damage accumulates where the pointer works the surface, heals slowly
      dmg += f * (0.3 + min(uSpeed, 5.0) * 1.2) * uDt * 2.0;
      dmg += uCollapse * uDt * 0.6;
      dmg -= uDt * mix(0.9, 0.12, clamp(inst, 0.0, 1.0));
      gl_FragColor = vec4(v, clamp(dmg, 0.0, 1.5));
    }
  `;

  // ---------- GPU simulation: position pass ----------
  const POS_FRAG = `
    uniform sampler2D tPos; uniform sampler2D tVel; uniform sampler2D tHome;
    uniform float uDt, uInit, uTime, uGlitch, uEnergy;
    varying vec2 vUv;
    ${HASH}
    void main(){
      vec4 H = texture2D(tHome, vUv);
      if (uInit > 0.5) {

    function schedule() {
      const sd = 60 / bpm / 4;
      if (nextT < ctx.currentTime - 0.2) nextT = ctx.currentTime + 0.05;
      while (nextT < ctx.currentTime + 0.15) {
        play(step, nextT + (step % 2 ? (swing - 0.5) * 2 * sd : 0));
        nextT += sd;
        step++;
      }
    }

    // ---- foley ----
    function glitch(a) {
      if (!on) return;
      const t = ctx.currentTime, n = 2 + ((R() * 4) | 0), f0 = 180 + R() * 1600;
      for (let i = 0; i < n; i++) {
        const tt = t + i * (0.025 + R() * 0.03);
        tone(tt, R() < 0.5 ? "square" : "sawtooth", f0 * (R() < 0.3 ? 2 : 1) * (1 + (R() - 0.5) * 0.3), 0.05 * a, 0.002, 0.02 + R() * 0.03, sfx);
      }
    }
    function thump(t, a) {
      tone(t, "sine", 90, 0.5 * a, 0.004, 0.25, sfx, 30);
      noiseHit(t, 0.12, "lowpass", 900, 0.7, 0.25 * a, sfx);
    }
    function collapse(t) {
      tone(t, "sawtooth", 420 + R() * 200, 0.12, 0.05, 1.6, sfx, 38);
      noiseHit(t, 1.4, "bandpass", 500, 0.6, 0.3, sfx);
    }
    function rebuild(t) {
      const [deg, q] = prog[Math.floor(step / 16) % prog.length];
      let base = root + deg;
      while (base > 57) base -= 12;
      CH[q].forEach((iv, i) => tone(t + i * 0.07, "sine", mtof(base + 24 + iv), 0.06, 0.01, 0.9, sfx));
    }
    function frame(st) {
      if (!on) return;
      const t = ctx.currentTime;
      const s = Math.min(st.speed, 5) * st.hover;
      const e = Math.min(1, st.energy + st.collapse);
      hissGain.gain.setTargetAtTime(Math.min(0.22, s * 0.06) + st.glitch * 0.04, t, 0.05);
      hissBP.frequency.setTargetAtTime(500 + s * 1400 + st.energy * 1200, t, 0.05);
      musicLP.frequency.setTargetAtTime(2600 * (1 - 0.6 * e) * (1 - 0.8 * st.collapse) + 200, t, 0.15);
      wobbleDepth.gain.setTargetAtTime(0.0012 + e * 0.004 + st.collapse * 0.006, t, 0.2);
      wobbleLFO.frequency.setTargetAtTime(0.55 + e * 3.5, t, 0.3);
      const cl = Math.round(e * 10) / 10;
      if (cl !== crushLevel) { crushLevel = cl; crush.curve = crushCurve(cl); }
      if (s > 2.5 && t - lastBlast > 0.18) { lastBlast = t; thump(t, Math.min(1, s / 5)); }
      if (st.collapse > 0.6 && !inCollapse) { inCollapse = true; collapse(t); }
      if (inCollapse && st.collapse < 0.3) { inCollapse = false; rebuild(t); }
    }

    async function toggle() {
      if (!ctx) init();
      if (ctx.state === "suspended") await ctx.resume();
      on = !on;
      const t = ctx.currentTime;
      master.gain.cancelScheduledValues(t);
      master.gain.setTargetAtTime(on ? 0.8 : 0, t, on ? 0.4 : 0.08);
      if (on && !timer) { nextT = ctx.currentTime + 0.08; timer = setInterval(schedule, 25); }
      if (!on && timer) { clearInterval(timer); timer = null; }
      return on;
    }
    document.addEventListener("visibilitychange", () => {
      if (!ctx) return;
      if (document.hidden) ctx.suspend();
      else if (on) ctx.resume();
    });
    return { toggle, frame, glitch };
  })();

  const sndBtn = $("snd");
  sndBtn.style.color = "#" + PAL.primary.getHexString();
  sndBtn.addEventListener("pointerdown", (e) => e.stopPropagation());
  sndBtn.addEventListener("click", async () => {
    try {
      const on = await Sound.toggle();
      sndBtn.setAttribute("aria-pressed", String(on));
      sndBtn.setAttribute("aria-label", on ? "Turn sound off" : "Turn sound on");
    } catch (e) {
      sndBtn.hidden = true;
    }
  });

  // ---------- interaction state ----------
  const pointer = { ndc: new THREE.Vector2(9, 9), inside: false, lx: 0, ly: 0, lt: 0 };
  const st = {
    hover: 0, speed: 0, speedTarget: 0, energy: 0, collapse: 0, collapseHold: 0, glitch: 0, lastMove: -10,
    velScreen: new THREE.Vector2(), velScreenTarget: new THREE.Vector2(), splitDir: new THREE.Vector2(1, 0),
    velWorld: new THREE.Vector3(), lastHit: null, parX: 0, parY: 0,
  };

  function onMove(e) {
    const now = performance.now() / 1000;
    const x = e.clientX, y = e.clientY, w = innerWidth, h = innerHeight;
    pointer.ndc.set((x / w) * 2 - 1, -(y / h) * 2 + 1);
    if (pointer.inside && pointer.lt) {
      const dt = Math.max(1 / 240, now - pointer.lt);
      const m = Math.min(w, h);
      const vx = (x - pointer.lx) / m / dt, vy = -(y - pointer.ly) / m / dt;
      st.velScreenTarget.set(vx, vy);
      st.speedTarget = Math.max(st.speedTarget * 0.5, Math.hypot(vx, vy));
    }
    pointer.inside = true;
    pointer.lx = x; pointer.ly = y; pointer.lt = now;
    st.lastMove = now;
  }
  function onLeave() { pointer.inside = false; pointer.lt = 0; st.lastHit = null; }
  addEventListener("pointermove", onMove, { passive: true });
  addEventListener("pointerdown", (e) => { pointer.lt = 0; onMove(e); }, { passive: true });
  addEventListener("pointerup", (e) => { if (e.pointerType !== "mouse") onLeave(); });
  addEventListener("pointercancel", onLeave);
  document.addEventListener("pointerleave", onLeave);
  addEventListener("blur", onLeave);

  const raycaster = new THREE.Raycaster();
  const inv = new THREE.Matrix4();
  const rayO = velMat.uniforms.uRayO.value, rayD = velMat.uniforms.uRayD.value;
  const hit = new THREE.Vector3(), tmpV = new THREE.Vector3();

  function update(dt, t) {
    const now = performance.now() / 1000;
    const idleFor = now - st.lastMove;
    const active = pointer.inside && idleFor < 0.25;

    st.hover += ((pointer.inside ? 1 : 0) - st.hover) * Math.min(1, dt * (pointer.inside ? 6 : 2.5));
    st.speed += (st.speedTarget - st.speed) * Math.min(1, dt * 12);
    st.speedTarget *= Math.exp(-dt * 7);
    st.velScreen.lerp(st.velScreenTarget, Math.min(1, dt * 10));
    st.velScreenTarget.multiplyScalar(Math.exp(-dt * 7));
    if (st.velScreen.length() > 0.08) st.splitDir.lerp(tmpV.set(st.velScreen.x, st.velScreen.y, 0).normalize(), Math.min(1, dt * 8)).normalize();

    // accumulation: presence alone barely registers, sustained speed builds instability
    const gain = st.hover * (0.012 + Math.min(st.speed, 5) * 0.09) * (active ? 1 : 0.12);
    st.energy += gain * dt;
    if (idleFor > 0.4 || !pointer.inside) st.energy -= dt * (0.35 + st.energy * 0.5);
    st.energy = Math.min(1.4, Math.max(0, st.energy));

    // collapse: near-total abstraction, then reconstruction
    if (idleFor > 0.4) st.collapseHold = Math.min(st.collapseHold, 0.25);
    if (st.collapseHold > 0) st.collapseHold -= dt;
    else if (st.collapse < 0.05 && st.energy > 0.7 && Math.random() < dt * (st.energy - 0.6) * 0.35) {
      st.collapseHold = 0.8 + Math.random() * 1.4;
      st.energy *= 0.7;
    }
    const ct = st.collapseHold > 0 ? 1 : 0;
    st.collapse += (ct - st.collapse) * Math.min(1, dt * (ct > st.collapse ? 3 : 2.2));

    // glitch pulses: rare at rest, frequent under pressure, lingering after
    const rate = (0.12 + st.energy * 1.2 + Math.min(st.speed, 4) * 0.4 * st.hover) * (reduced ? 0.4 : 1);
    if (Math.random() < rate * dt) {
      const g = 0.3 + Math.random() * 0.7;
      if (g > st.glitch) Sound.glitch(g);
      st.glitch = Math.max(st.glitch, g);
    }
    st.glitch *= Math.exp(-dt * 7);

    // slow sway plus pointer parallax
    const tx = pointer.inside ? pointer.ndc.x : 0, ty = pointer.inside ? pointer.ndc.y : 0;
    st.parX += (tx - st.parX) * Math.min(1, dt * 1.5);
    st.parY += (ty - st.parY) * Math.min(1, dt * 1.5);
    const sway = reduced ? 0.4 : 1;
    sculpture.rotation.y = Math.sin(t * 0.21) * 0.1 * sway + st.parX * 0.45;
    sculpture.rotation.x = Math.sin(t * 0.13) * 0.04 * sway - st.parY * 0.25;
    sculpture.rotation.z = Math.sin(t * 0.09) * 0.012 * sway;
    sculpture.updateMatrixWorld();

    // pointer ray into object space
    raycaster.setFromCamera(pointer.ndc, camera);
    inv.copy(sculpture.matrixWorld).invert();
    rayO.copy(raycaster.ray.origin).applyMatrix4(inv);
    rayD.copy(raycaster.ray.direction).transformDirection(inv);
    if (pointer.inside && Math.abs(rayD.z) > 1e-4) {
      hit.copy(rayD).multiplyScalar(-rayO.z / rayD.z).add(rayO);
      if (st.lastHit) {
        tmpV.copy(hit).sub(st.lastHit).divideScalar(Math.max(dt, 1 / 240));
        if (tmpV.length() > 14) tmpV.setLength(14);
        st.velWorld.lerp(tmpV, Math.min(1, dt * 12));
      } else st.lastHit = new THREE.Vector3();
      st.lastHit.copy(hit);
    }
    st.velWorld.multiplyScalar(Math.exp(-dt * 4));

    const vu = velMat.uniforms;
    vu.uTime.value = t; vu.uDt.value = dt; vu.uEnergy.value = st.energy; vu.uCollapse.value = st.collapse;
    vu.uGlitch.value = st.glitch; vu.uHover.value = st.hover; vu.uSpeed.value = st.speed;
    vu.uMouseVel.value.copy(st.velWorld);
    const pu = posMat.uniforms;
    pu.uTime.value = t; pu.uDt.value = dt; pu.uGlitch.value = st.glitch; pu.uEnergy.value = st.energy;
    const pt = ptMat.uniforms;
    pt.uTime.value = t; pt.uEnergy.value = st.energy; pt.uGlitch.value = st.glitch; pt.uCollapse.value = st.collapse;
    const tu = trailMat.uniforms;
    tu.uTime.value = t; tu.uEnergy.value = st.energy;
    tu.uDecay.value = Math.min(0.95, 0.35 + Math.min(st.energy, 1) * 0.5 + st.glitch * 0.1 + st.collapse * 0.1);
    tu.uDrift.value.set(st.velScreen.x * dt * 0.25 * st.hover, st.velScreen.y * dt * 0.25 * st.hover + 0.0008 * st.energy);
    const fu = finalMat.uniforms;
    fu.uTime.value = t; fu.uEnergy.value = st.energy; fu.uGlitch.value = st.glitch; fu.uSpeed.value = st.speed;
    fu.uCollapse.value = st.collapse; fu.uHover.value = st.hover;
    fu.uMouse.value.set(pointer.ndc.x * 0.5 + 0.5, pointer.ndc.y * 0.5 + 0.5);
    fu.uSplitDir.value.copy(st.splitDir);
    Sound.frame(st);
  }

  // ---------- loop ----------
  let cur = 0, tCur = 0, first = true, last = performance.now() / 1000, t0 = last;
  function frame() {
    const nowS = performance.now() / 1000;
    const dt = Math.min(1 / 30, Math.max(1 / 240, nowS - last));
    last = nowS;
    const t = nowS - t0;
    update(dt, t);

    const nxt = 1 - cur;
    velMat.uniforms.uInit.value = posMat.uniforms.uInit.value = first ? 1 : 0;
    velMat.uniforms.tPos.value = posRT[cur].texture;
    velMat.uniforms.tVel.value = velRT[cur].texture;
    pass(velMat, velRT[nxt]);
    posMat.uniforms.tPos.value = posRT[cur].texture;
    posMat.uniforms.tVel.value = velRT[nxt].texture;
    pass(posMat, posRT[nxt]);
    cur = nxt;
    first = false;

    ptMat.uniforms.tPos.value = posRT[cur].texture;
    renderer.setRenderTarget(sceneRT);
    renderer.render(scene, camera);

    const tn = 1 - tCur;
    trailMat.uniforms.tScene.value = sceneRT.texture;
    trailMat.uniforms.tPrev.value = trailRT[tCur].texture;
    pass(trailMat, trailRT[tn]);
    tCur = tn;

    finalMat.uniforms.tTrail.value = trailRT[tCur].texture;
    pass(finalMat, null);

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>

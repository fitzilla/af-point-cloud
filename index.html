<style>
/* Layout: one full-bleed WebGL stage; quiet controls in the bottom corners, each opening a card above itself */
:root {
  --void: #020604;
  --tint: #7cff4f;
  --lavender: #d8a0ff;
  --mono: "Martian Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --edge: max(16px, env(safe-area-inset-left, 0px));
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; }
body {
  background: var(--void);
  color: var(--tint);
  overflow: hidden;
  font-family: var(--mono);
  -webkit-font-smoothing: antialiased;
}
#stage {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
  cursor: crosshair;
  background: var(--void);
}
/* the title, top left, until they do something */
#title { position: fixed; z-index: 2; top: calc(env(safe-area-inset-top, 0px) + 22px); left: calc(var(--edge) + 6px); margin: 0; pointer-events: none; color: var(--tint); font: 400 clamp(48px, 7.4vw, 104px)/0.88 Anton, Impact, "Arial Narrow", sans-serif; letter-spacing: 0.01em; text-transform: uppercase; transition: opacity 1.4s ease, transform 1.4s ease; }
#title.gone { opacity: 0; transform: translateY(-10px); }
/* the title and the dock wait for his colours (and the title's font), so nothing changes colour as the page loads */
body:not(.ready) #title, body:not(.ready) .dock, body:not(.ready) #corner { opacity: 0; transition: none; }
.dock, #corner { transition: opacity 0.6s ease; }
/* the dock: what's always there, then the two things you switch on */
.dock {
  position: fixed;
  z-index: 3;
  left: 50%;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
  transform: translateX(-50%);
  display: flex;
  align-items: stretch;
  gap: 6px;
  padding: 6px;
  background: rgba(4, 9, 8, 0.9);
  border: 1px solid rgba(255, 255, 255, 0.09);
  border-radius: 20px;
  box-shadow: 0 18px 50px rgba(0, 0, 0, 0.55);
  color: var(--tint);
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
}
.dock button { font-family: var(--mono); color: inherit; cursor: pointer; }
.dock button:focus-visible { outline: 1px solid currentColor; outline-offset: 2px; }
/* every part of the dock is 64px tall, with 14px corners that sit inside the dock's 20px ones */
.key { width: 72px; height: 64px; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; background: transparent; border: 0; border-radius: 14px; font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; transition: background 0.2s; }
.key:hover, .key[aria-expanded="true"] { background: color-mix(in srgb, var(--tint) 13%, transparent); }
.key b { font-size: 17px; font-weight: 500; line-height: 18px; letter-spacing: 0; }
.key.small { width: 48px; }
/* before a song: picking one is the thing to do, so Songs is the filled button and Listen waits its turn */
.key.primary { width: 112px; background: var(--tint); color: #020604; font-weight: 500; }
.key.primary:hover { background: var(--tint); filter: brightness(1.12); }
.key.primary svg { animation: bob 1.6s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-2px); } }
.tile.waiting { opacity: 0.45; }
.tile.waiting:hover { opacity: 0.7; }
.phone-only { display: none; }
.rule { width: 1px; margin: 10px 4px; background: rgba(255, 255, 255, 0.1); }
#tap.hit b { animation: tapped 0.25s ease-out; }
@keyframes tapped { from { transform: scale(1.5); } }
#fs .exit { display: none; }
#fs[aria-pressed="true"] .exit { display: inline; }
#fs[aria-pressed="true"] .enter { display: none; }
/* a switch: OFF is dashed, ON is filled. Icon, then the name over one short line of status, then the
   knob, centred. The status is always one line, so the switch never changes size. */
.tile { width: 216px; height: 64px; box-sizing: border-box; padding: 0 12px 0 14px; display: grid; grid-template-columns: 18px minmax(0, 1fr) 38px; column-gap: 10px; align-items: center; text-align: left; background: transparent; border: 1px dashed rgba(255, 255, 255, 0.28); border-radius: 14px; transition: background 0.25s, border-color 0.25s, color 0.25s; }
.tile:hover { background: color-mix(in srgb, var(--tint) 8%, transparent); }
.tile .txt { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.tile .name { font-size: 10px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; white-space: nowrap; }
.tile .say { font-size: 9px; line-height: 1.3; letter-spacing: 0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0.75; }
.knob { width: 38px; height: 22px; padding: 2px; box-sizing: border-box; border-radius: 11px; background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.25); display: flex; align-items: center; transition: background 0.25s, border-color 0.25s; }
.knob i { width: 16px; height: 16px; border-radius: 8px; background: rgba(255, 255, 255, 0.5); transition: transform 0.25s ease, background 0.25s; }
.tile[aria-checked="true"] { background: var(--tint); border: 1px solid var(--tint); color: #020604; }
.tile[aria-checked="true"] .knob { background: #020604; border-color: #020604; }
.tile[aria-checked="true"] .knob i { transform: translateX(16px); background: var(--tint); }
.tile[aria-checked="true"] .say { opacity: 1; }
.tile[aria-busy="true"] .knob i { animation: busy 0.9s ease-in-out infinite; }
@keyframes busy { 50% { transform: translateX(8px); } }
/* a song is on and he can't hear it: Listen asks, gently */
.tile.nudge { animation: nudge 2.4s ease-in-out infinite; }
@keyframes nudge { 50% { border-color: var(--tint); box-shadow: 0 0 0 3px color-mix(in srgb, var(--tint) 18%, transparent); } }
/* a card opens above the dock; on a phone it's a sheet you can swipe away */
.card {
  position: fixed;
  z-index: 4;
  left: 50%;
  bottom: calc(var(--dock-h, 96px) + env(safe-area-inset-bottom, 0px) + 32px);
  width: min(320px, calc(100vw - 32px));
  max-height: calc(100vh - var(--dock-h, 96px) - 60px);
  overflow: auto;
  box-sizing: border-box;
  padding: 16px;
  background: rgba(4, 9, 6, 0.94);
  border: 1px solid color-mix(in srgb, var(--tint) 28%, transparent);
  border-radius: 16px;
  color: var(--tint);
  font: 400 10px/1.6 var(--mono);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  opacity: 0;
  visibility: hidden;
  transform: translate(-50%, 10px);
  transition: opacity 0.18s ease, transform 0.18s ease, visibility 0s linear 0.18s;
}
.card.open { opacity: 1; visibility: visible; transform: translate(-50%, 0); transition: opacity 0.18s ease, transform 0.18s ease; }
.card:focus { outline: none; }
.grab { display: none; }
@media (pointer: coarse) { .grab { display: block; width: 38px; height: 4px; margin: -6px auto 12px; border-radius: 2px; background: color-mix(in srgb, var(--tint) 40%, transparent); } }
.card h2 { margin: 0 0 10px; font: inherit; opacity: 0.6; }
.card p { margin: 10px 0 0; opacity: 0.75; text-transform: none; letter-spacing: 0.04em; min-height: 1.6em; }
.card button, .card input { font: inherit; letter-spacing: inherit; color: inherit; }
.rows { display: grid; gap: 2px; }
.rows button {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  width: 100%;
  min-height: 40px;
  align-items: center;
  padding: 8px 10px;
  background: transparent;
  border: 0;
  border-radius: 8px;
  text-align: left;
  text-transform: uppercase;
  cursor: pointer;
}
.rows button:hover, .rows button:focus-visible { background: color-mix(in srgb, var(--tint) 14%, transparent); outline: none; }
.rows b { font-weight: 500; }
.rows span { opacity: 0.55; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#link-form { display: flex; gap: 6px; margin-top: 10px; }
#link {
  flex: 1;
  min-width: 0;
  padding: 10px;
  background: transparent;
  border: 1px solid color-mix(in srgb, var(--tint) 35%, transparent);
  border-radius: 8px;
  text-transform: none;
  letter-spacing: 0.02em;
}
#link::placeholder { color: inherit; opacity: 0.5; }
#link:focus { outline: none; border-color: var(--tint); }
#link-form button { padding: 8px 14px; background: var(--tint); color: #020604; border: 0; border-radius: 8px; text-transform: uppercase; cursor: pointer; }
/* YouTube's player stays on screen while a song plays (YouTube asks for at least 200 x 200) */
#tube {
  position: fixed;
  z-index: 3;
  left: calc(var(--edge) + 4px);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
  width: 300px;
  border: 1px solid color-mix(in srgb, var(--tint) 28%, transparent);
  border-radius: 14px;
  overflow: hidden;
  background: #000;
  color: var(--tint);
}
#tube[hidden] { display: none; }
#tube .screen { height: 200px; }
#tube .screen iframe { display: block; width: 100%; height: 100%; border: 0; }
#tube .bar { display: flex; align-items: center; gap: 8px; padding: 6px 4px 6px 12px; font: 400 9px/1.4 var(--mono); letter-spacing: 0.1em; text-transform: uppercase; }
#now { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0.8; }
#tube-close { padding: 8px 10px; background: transparent; border: 0; color: inherit; font: inherit; letter-spacing: inherit; text-transform: uppercase; cursor: pointer; opacity: 0.7; }
#tube-close:hover { opacity: 1; }
/* not enough room beside the dock: the player sits above it, on the left */
@media (max-width: 1380px) { #tube { bottom: calc(var(--dock-h, 96px) + env(safe-area-inset-bottom, 0px) + 32px); } }
/* top right: the visitor counter, and an info button with who made this behind it */
#corner { position: fixed; z-index: 3; top: calc(env(safe-area-inset-top, 0px) + 16px); right: calc(max(16px, env(safe-area-inset-right, 0px)) + 4px); display: flex; align-items: center; gap: 10px; color: var(--tint); }
#count { margin: 0; display: flex; align-items: center; gap: 8px; font: 400 9px/1 var(--mono); letter-spacing: 0.14em; text-transform: uppercase; }
#count[hidden] { display: none; }
#count span { opacity: 0.6; }
#count-n { display: flex; gap: 2px; font-weight: 500; }
#count-n i { width: 13px; height: 20px; display: grid; place-items: center; font: 500 11px/1 var(--mono); letter-spacing: 0; font-style: normal; background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.14); border-radius: 3px; }
#info { width: 36px; height: 36px; display: grid; place-items: center; padding: 0; background: rgba(4, 9, 8, 0.6); border: 1px solid rgba(255, 255, 255, 0.14); border-radius: 18px; color: inherit; cursor: pointer; transition: background 0.2s; }
#info:hover, #info[aria-expanded="true"] { background: color-mix(in srgb, var(--tint) 16%, transparent); }
#info:focus-visible { outline: 1px solid currentColor; outline-offset: 2px; }
.card.top { top: calc(env(safe-area-inset-top, 0px) + 62px); bottom: auto; left: auto; right: calc(max(16px, env(safe-area-inset-right, 0px)) + 4px); width: min(260px, calc(100vw - 32px)); transform: translateY(-8px); }
.card.top.open { transform: none; }
.card a.out { display: flex; align-items: center; justify-content: space-between; min-height: 40px; margin-top: 12px; padding: 0 12px; background: var(--tint); color: #020604; border-radius: 8px; font-weight: 500; text-decoration: none; }
.card a.out:hover { filter: brightness(1.12); }
.card a.out:focus-visible { outline: 1px solid var(--tint); outline-offset: 2px; }
/* Copy me: their own picture, small, top right under the counter, so they can see what he can see */
#cam { position: fixed; z-index: 3; top: calc(env(safe-area-inset-top, 0px) + 64px); right: calc(max(16px, env(safe-area-inset-right, 0px)) + 4px); width: 168px; border: 1px solid var(--tint); border-radius: 12px; overflow: hidden; background: #000; color: var(--tint); }
#cam[hidden] { display: none; }
#cam video { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; transform: scaleX(-1); }
#cam p { margin: 0; padding: 7px 10px; display: flex; align-items: center; gap: 6px; font: 400 9px/1.4 var(--mono); letter-spacing: 0.1em; text-transform: uppercase; }
#cam p::before { content: ""; flex: none; width: 6px; height: 6px; border-radius: 3px; background: #ff5a5a; box-shadow: 0 0 6px #ff5a5a; }
/* other visitors' cursors */
#peers { position: fixed; inset: 0; z-index: 2; pointer-events: none; overflow: hidden; }
#peers i { position: absolute; left: 0; top: 0; width: 6px; height: 6px; margin: -3px 0 0 -3px; background: currentColor; box-shadow: 0 0 8px 2px currentColor, 0 0 22px 6px color-mix(in srgb, currentColor 35%, transparent); opacity: 0; will-change: transform, opacity; }
/* first visit: a quiet nudge at the top that comes and goes until they do something */
#hint { position: fixed; z-index: 2; top: calc(env(safe-area-inset-top, 0px) + 24px); left: 50%; transform: translateX(-50%); pointer-events: none; color: var(--tint); font: 400 10px/1 var(--mono); letter-spacing: 0.22em; text-transform: uppercase; white-space: nowrap; opacity: 0; transition: opacity 1.6s ease; }
#hint.on { opacity: 0.6; }
#hint b { font-weight: inherit; animation: caret 1.1s steps(1) infinite; }
@keyframes caret { 50% { opacity: 0; } }
.fail { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding-inline: 24px; color: var(--lavender); font: 300 12px/1.8 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; }
@media (max-width: 640px) {
  /* the dock becomes two rows: the switches on top, the rest beneath */
  .dock { left: 12px; right: 12px; transform: none; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; padding: 6px; }
  .rule, #fs { display: none; }
  .phone-only { display: inline; }
  .tile { width: auto; grid-column: span 3; height: 60px; padding: 0 10px 0 12px; grid-template-columns: minmax(0, 1fr) 38px; }
  .tile > svg { display: none; }
  .tile .say { font-size: 8.5px; letter-spacing: 0; }
  .key, .key.small { width: auto; grid-column: span 2; height: 46px; flex-direction: row; gap: 8px; padding: 0; }
  #listen { grid-row: 1; grid-column: 1 / span 3; }
  #copy { grid-row: 1; grid-column: 4 / span 3; }
  .card { left: 12px; right: 12px; width: auto; transform: translateY(10px); bottom: calc(var(--dock-h, 150px) + env(safe-area-inset-bottom, 0px) + 22px); max-height: calc(100dvh - var(--dock-h, 150px) - 50px); }
  .card.open { transform: none; }
  #tube { left: 12px; right: 12px; width: auto; bottom: calc(var(--dock-h, 150px) + env(safe-area-inset-bottom, 0px) + 22px); }
  #title { font-size: 34px; top: calc(env(safe-area-inset-top, 0px) + 16px); left: 16px; }
  #hint { top: auto; bottom: calc(var(--dock-h, 150px) + env(safe-area-inset-bottom, 0px) + 24px); }
  #cam { width: 104px; top: calc(env(safe-area-inset-top, 0px) + 60px); }
  #corner { top: calc(env(safe-area-inset-top, 0px) + 12px); right: 12px; gap: 8px; }
  #count span { display: none; }
  .card.top { top: auto; left: 12px; right: 12px; width: auto; transform: translateY(10px); bottom: calc(var(--dock-h, 150px) + env(safe-area-inset-bottom, 0px) + 22px); }
  #cam p { padding: 5px 7px; font-size: 8px; letter-spacing: 0.06em; }
  body.card-open #tube { visibility: hidden; }
}
@media (prefers-reduced-motion: reduce) {
  #hint, #title, .card, .card.open, .tile, .knob, .knob i { transition: none; }
  #hint b, #tap.hit b, .tile.nudge, .tile[aria-busy="true"] .knob i, .key.primary svg { animation: none; }
}
</style>

<canvas id="stage" role="img" aria-label="A skeleton built from a cloud of symbols. Pick a song and he dances to it. He watches the pointer; type to change what he is made of."></canvas>

<div id="peers"></div>

<h1 id="title">Dance<br>Dance<br>Skeleton</h1>

<div id="hint" aria-hidden="true"><span id="hint-text">Pick a song</span><b>_</b></div>

<div id="tube" hidden>
  <div class="screen"><div id="player"></div></div>
  <div class="bar"><span id="now"></span><button id="tube-close" type="button" aria-label="Stop the music and close the player">Stop</button></div>
</div>

<div class="card" id="card-song" tabindex="-1" role="dialog" aria-label="Songs">
  <h2>He dances to</h2>
  <div class="rows" id="songs"></div>
  <form id="link-form">
    <input id="link" type="text" inputmode="url" autocomplete="off" spellcheck="false" placeholder="or paste a YouTube link" aria-label="A YouTube link">
    <button type="submit">Go</button>
  </form>
  <p id="pick-note" role="status"></p>
</div>

<div class="card" id="card-listen" tabindex="-1" role="dialog" aria-label="Let him hear it">
  <h2>How should he hear it?</h2>
  <div class="rows">
    <button id="listen-tab" type="button"><b>This tab&rsquo;s sound</b><span>headphones</span></button>
    <button id="listen-mic" type="button"><b>Microphone</b><span>turn it up</span></button>
  </div>
  <p id="listen-note" role="status">YouTube won&rsquo;t let a page hear its player, so he guesses the beat. Let him listen and he follows the real one. Nothing is recorded.</p>
</div>

<div id="corner">
  <p id="count" hidden><span>Visitors</span><b id="count-n"></b></p>
  <button id="info" type="button" data-card="card-info" aria-expanded="false" aria-label="About this">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 11v6" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="11" y="6.6" width="2" height="2" fill="currentColor"/></svg>
  </button>
</div>

<div class="card top" id="card-info" tabindex="-1" role="dialog" aria-label="About this">
  <h2>Dance Dance Skeleton</h2>
  <p>Made by Aaron.</p>
  <a class="out" href="https://www.linkedin.com/in/aaron-fitzsimmons-533a1312/" target="_blank" rel="noopener">Aaron on LinkedIn<span aria-hidden="true">&#8599;</span></a>
</div>

<div id="cam" class="ph-no-capture" hidden>
  <video id="cam-view" muted playsinline aria-label="Your camera, mirrored"></video>
  <p id="cam-note" role="status"></p>
</div>

<nav class="dock" id="dock" aria-label="Controls">
  <button id="song" class="key" type="button" data-card="card-song" aria-expanded="false">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M9 18V5l11-2v13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="square"/><rect x="4" y="15" width="5" height="5" fill="currentColor"/><rect x="15" y="13" width="5" height="5" fill="currentColor"/></svg>
